services:
  postgres:
    image: postgres:15
    container_name: t1_anticheat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-t1_anticheat}
      POSTGRES_USER: ${DB_USERNAME:-t1_anticheat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-t1_anticheat}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - t1_anticheat_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-t1_anticheat} -d ${DB_DATABASE:-t1_anticheat}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  t1_anticheat_pgdata:
